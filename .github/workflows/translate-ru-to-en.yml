name: Translate RU to EN in mintlify-docs

# Этот workflow размещается в репозитории mintlify-docs (не doc-reviewer).
# Срабатывает при изменениях в папке ru/ и автоматически обновляет en/.

on:
  push:
    branches:
      - main
    paths:
      - 'ru/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'LLM model name (leave empty for default from config.yml)'
        required: false
        default: ''
      since:
        description: 'Git ref to diff from (default: HEAD~1)'
        required: false
        default: 'HEAD~1'

jobs:
  translate-ru-to-en:
    name: Translate RU → EN
    runs-on: self-hosted          # ← запускается на вашем компьютере

    defaults:
      run:
        shell: powershell

    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Clean leftover temp folders
        run: |
          if (Test-Path "doc-reviewer-scripts") {
            Remove-Item -Recurse -Force "doc-reviewer-scripts"
          }

      - name: Checkout mintlify-docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна полная история для git diff
          token: ${{ secrets.GH_TOKEN }}

      - name: Ensure full git history
        run: |
          $shallow = git rev-parse --is-shallow-repository
          if ($shallow -eq "true") { git fetch --unshallow }

      - name: Checkout automation scripts from doc-reviewer
        uses: actions/checkout@v4
        with:
          repository: amihailov76/doc-reviewer
          path: doc-reviewer-scripts
          token: ${{ secrets.GH_TOKEN }}
          sparse-checkout: |
            docs/automation
          sparse-checkout-cone-mode: false

      - name: Copy automation scripts
        run: |
          New-Item -ItemType Directory -Force -Path automation | Out-Null
          Copy-Item -Recurse -Force doc-reviewer-scripts/docs/automation/* automation/
          Remove-Item -Recurse -Force doc-reviewer-scripts
          # Убираем gitlink из индекса git, если он туда попал в предыдущих запусках
          git rm --cached -r --ignore-unmatch doc-reviewer-scripts

      - name: Lint changed RU files
        run: |
          $since = "${{ github.event.inputs.since }}"
          if (-not $since) { $since = "HEAD~1" }
          $changedRu = git diff --name-only $since HEAD -- 'ru/**' |
            Where-Object { $_ -match '\.mdx$' }
          if ($changedRu) {
            Write-Host "Checking: $($changedRu -join ', ')"
            & python automation/lint_docs.py @changedRu --repo-path .
          } else {
            Write-Host "No RU files to lint"
          }

      - name: Install dependencies
        run: pip install openai pyyaml httpx

      - name: Update config paths for this run
        run: |
          $script = @"
          import yaml, pathlib
          cfg_path = pathlib.Path('automation/config.yml')
          cfg = yaml.safe_load(cfg_path.read_text(encoding='utf-8'))
          cfg['repos']['mintlify_docs'] = '.'
          cfg_path.write_text(yaml.dump(cfg, allow_unicode=True), encoding='utf-8')
          "@
          $script | python

      - name: Run translation script
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          LLM_SSL_VERIFY: "false"
          LLM_NO_PROXY: "true"
        run: |
          $model = "${{ github.event.inputs.model }}"
          $since = "${{ github.event.inputs.since }}"
          if (-not $since) { $since = "HEAD~1" }
          $scriptArgs = @("automation/translate_to_en.py", "--since", $since, "--no-pr")
          if ($model) { $scriptArgs += @("--model", $model) }
          & python @scriptArgs
